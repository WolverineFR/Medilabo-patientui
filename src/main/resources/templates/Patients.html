<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Medilabo Solutions</title>
	<link rel="stylesheet" type="text/css" href="webjars/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
	<div class="container mt-5">
		<h2 class="mb-4">Liste des Patients</h2>

		<table class="table table-striped table-bordered table:hover">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>Prénom</th>
					<th>Nom</th>
					<th>Date de naissance</th>
					<th>Sexe</th>
					<th>Adresse</th>
					<th>Téléphone</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="patient : ${patients}" th:onclick="'window.location=\'/patient/' + ${patient.id} + '\';'">
					<td th:text="${patient.id}">ID</td>
					<td th:text="${patient.firstName}">Prénom</td>
					<td th:text="${patient.lastName}">Nom</td>
					<td th:text="${patient.birthDate}">Date</td>
					<td th:text="${patient.gender}">Sexe</td>
					<td th:text="${patient.address}">Adresse</td>
					<td th:text="${patient.phone}">Téléphone</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
<style>
	.tbody tr:hover {
		background-color: #d6d8db !important;
		cursor: pointer;
		transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
		transform: scale(1.01);
		box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
	}
</style>

</html>
